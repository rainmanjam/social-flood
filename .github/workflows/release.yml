# .github/workflows/release.yml
#
# HOW THE BROKEN TRIGGER WAS FIXED (CRT-6)
# ----------------------------------------
# Before: two jobs in one workflow, gated on the actor.
#
#     bump-version:  if: github.actor != 'github-actions[bot]'   # ran
#     release:       if: github.actor == 'github-actions[bot]'   # never ran
#
# The `release` job was waiting for the workflow to be re-triggered by the
# commit that `bump-version` pushed. But `bump-version` pushed with the default
# GITHUB_TOKEN, and GitHub deliberately does not trigger workflow runs from
# pushes made with GITHUB_TOKEN (loop protection). So the second run never
# happened and `release` had not executed since v1.5.1 (2025-09-16). Docker Hub
# `latest` and `1.6.0` were pushed by hand, unsigned.
#
# After: ONE run, sequential jobs joined by `needs`. No second trigger is
# required, so no token can withhold it.
#
#     verify  ->  bump-version  ->  publish
#
# `bump-version` still pushes the version commit and now also pushes a `vX.Y.Z`
# tag, so the tag exists for humans and for `git describe`. But publishing does
# NOT depend on that tag firing a workflow - it depends on `needs`.
#
# TRADE-OFF vs. the alternatives:
#   * PAT in a secret - works, and is the only way to make a bot push trigger
#     another workflow, but it means a long-lived human-scoped credential with
#     write access sitting in repo secrets, plus rotation and audit burden.
#   * workflow_dispatch only - safe, but makes every release a manual click and
#     the whole point was to restore automation.
#   * tag-push trigger (`on: push: tags:`) - clean in principle, BUT it has
#     exactly the same defect as the current code: the tag would be pushed by
#     GITHUB_TOKEN and therefore would not trigger the run either. It only works
#     if you also add a PAT, so it buys nothing over the PAT option.
#   * CHOSEN: same-run `needs` chaining. Zero new secrets, zero new failure
#     modes, and the publish step is now provably gated on the verify jobs
#     because they are in the same run's dependency graph.
name: Release

on:
  push:
    branches: [ main ]
  # Manual re-run, e.g. to republish after a registry outage.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same gates a pull request gets. Nothing is bumped or published unless lint,
  # the full pytest suite (with the coverage floor), the boot check and the
  # docker health check all pass.
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml
    permissions:
      contents: read

  bump-version:
    name: Bump Version
    needs: [ verify ]
    runs-on: ubuntu-latest
    # Two guards:
    #   * `github.ref == 'refs/heads/main'` - without it, anyone able to run
    #     workflow_dispatch could pick a feature branch or a tag from the ref
    #     picker and publish unmerged code as a release. (A dispatch from a tag
    #     would also fail at `git push origin HEAD:$GITHUB_REF`.)
    #   * the head-commit check - skip if the head commit is itself a bump
    #     commit. Pushes made with GITHUB_TOKEN do not re-trigger this workflow,
    #     but a maintainer pushing a bump commit by hand (or with a PAT) would.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       !startsWith(github.event.head_commit.message, 'chore: bump version to'))
    permissions:
      contents: write
    outputs:
      version: ${{ steps.new-version.outputs.version }}
      changed: ${{ steps.commit.outputs.changed }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Increment version
        run: python scripts/increment_version.py patch

      - name: Read new version
        id: new-version
        run: |
          VERSION=$(python -c "from app.__version__ import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version bumped to $VERSION"

      - name: Commit and tag version bump
        id: commit
        run: |
          set -euo pipefail
          VERSION='${{ steps.new-version.outputs.version }}'
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/__version__.py
          if git diff --cached --quiet; then
            echo "No version change; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists on origin"
            exit 1
          fi
          git commit -m "chore: bump version to v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "HEAD:${GITHUB_REF}"
          git push origin "refs/tags/v${VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Release
    needs: [ verify, bump-version ]
    if: needs.bump-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write   # required for keyless cosign signing
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      TAG: ${{ needs.bump-version.outputs.tag }}
    steps:
      # Check out the TAG the bump job just pushed, not the pre-bump SHA that
      # triggered this run - otherwise the published image would not contain the
      # version it claims.
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/social-flood
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Sign by DIGEST, not by tag. Signing a mutable tag signs whatever that
      # tag pointed at when cosign resolved it; the digest is what the build
      # actually produced and is what `cosign verify` should be pinned to.
      - name: Sign images (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DOCKERHUB_USER}/social-flood@${DIGEST}"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate and attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "${DOCKERHUB_USER}/social-flood@${DIGEST}" -o spdx-json > sbom.json
          cosign attest --yes --predicate sbom.json --type spdx \
            "${DOCKERHUB_USER}/social-flood@${DIGEST}"
          cosign attest --yes --predicate sbom.json --type spdx \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

      # Commit subjects are untrusted input. They are written to a file with a
      # heredoc rather than interpolated into a shell command.
      - name: Generate release notes
        id: notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" > changes.txt
          else
            git log --pretty=format:'- %s' -20 > changes.txt
          fi

          {
            echo "## Release ${TAG}"
            echo ""
            echo "### Changes"
            echo ""
            cat changes.txt
            echo ""
            echo ""
            echo "### Images"
            echo ""
            echo "- \`${DOCKERHUB_USER}/social-flood:${VERSION}\`"
            echo "- \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo "### Verify the signature"
            echo ""
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
            echo '```'
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body_path: release-notes.md
          files: sbom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
